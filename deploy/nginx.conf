# 免费代理猎手 · Nginx 反向代理
# ---------------------------------------------------------------
# 后端已把前端产物（dist/）一起托管，所以这里**只需要一路转发**，
# 不需要再配 root/try_files —— 少一份配置就少一处不一致。
#
# 放好之后：
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/proxy-hunter.conf
#   sudo htpasswd -c /etc/nginx/.htpasswd admin      # 或下面的 openssl 写法
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ auth_basic 必须覆盖 /api。本应用没有内置鉴权，
#    只保护页面等于没保护 —— 绕过前端直接 curl 就能用你的 API Key 跑对话。

# ---------------------------------------------------------------------------
# 若前面还有一层 Cloudflare（橙色云 / Tunnel），需要让后端拿到真实客户端 IP。
# Tunnel 场景最简单：回源来自本机，一行就够。
#   set_real_ip_from 127.0.0.1;
#   real_ip_header   CF-Connecting-IP;
# 橙色云直连场景要信任 Cloudflare 的出口网段，列表会变，别照抄旧列表：
#   curl -s https://www.cloudflare.com/ips-v4 \
#     | sed 's/^/set_real_ip_from /; s/$/;/' > /etc/nginx/cloudflare-ips.conf
# 然后取消下面 include 的注释。
# ---------------------------------------------------------------------------

server {
    listen      80;
    listen      [::]:80;
    server_name your-domain.com;

    # 生成密码文件（二选一）：
    #   sudo htpasswd -c /etc/nginx/.htpasswd admin
    #   printf 'admin:%s\n' "$(openssl passwd -apr1 '你的密码')" | sudo tee /etc/nginx/.htpasswd
    auth_basic           "Proxy Hunter";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 采集与测速会返回成批数据，这里给一点余量
    client_max_body_size 8m;   # 修改引擎配置的请求体很小，防滥用即可

    # include /etc/nginx/cloudflare-ips.conf;
    set_real_ip_from 127.0.0.1;
    real_ip_header   CF-Connecting-IP;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 后端靠这个头判断 req.protocol，进而生成正确的 Clash 订阅地址。
        # 漏掉它，页面上复制出来的订阅链接会永远指向 http://。
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 清空 Connection 才能和上游保持长连接；设成 close 会让 SSE 频繁重建
        proxy_set_header   Connection        "";

        # ---- SSE 长连接的关键三项 ----
        # /api/chat 与 /api/proxy/stream 都是 event-stream。
        # Nginx 默认会把响应攒起来再发，症状是「请求发出去了，页面一直不出字」。
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 静态资源（带内容 hash）可以放心长缓存，减轻后端压力
    location /assets/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_cache_valid  200 7d;
        expires            7d;
        add_header         Cache-Control "public, immutable";
    }

    # 健康检查放开鉴权，方便外部探活（仅暴露状态，不含敏感信息）
    location = /api/health {
        auth_basic off;
        proxy_pass       http://127.0.0.1:3000/api/health;
        proxy_set_header Host $host;
        access_log       off;
    }
}

# ---------------------------------------------------------------------------
# HTTPS：直接用 certbot 签，不需要改后端
#   sudo certbot --nginx -d your-domain.com
# 应用不写死协议，同源请求会跟随页面协议；上面 X-Forwarded-Proto 已配好，
# 签约完成后页面里生成的 Clash 订阅地址会自动变成 https://。
# ---------------------------------------------------------------------------
