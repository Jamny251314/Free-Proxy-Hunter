# ============================================================
# 免费代理猎手 · Clash Verge / Mihomo 配置
# 生成时间: 2026/9/16 22:08:50
# 节点数量: 1
# 说明: 免费代理稳定性有限，建议将「自动选择」作为默认策略
# ============================================================

mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - 'localhost.ptlogin2.qq.com'
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - https://doh.pub/dns-query
  fallback:
    - 8.8.8.8
    - 1.1.1.1
    - tls://dns.google:853

proxies:
  - name: "FH-001 🇨🇳娄底-176ms"
    type: http
    server: 183.215.23.242
    port: 9091
    udp: false
    skip-cert-verify: true

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🔯 故障转移
      - DIRECT
      - "FH-001 🇨🇳娄底-176ms"

  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 60
    lazy: true
    proxies:
      - "FH-001 🇨🇳娄底-176ms"

  - name: 🔯 故障转移
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 300
    lazy: true
    proxies:
      - "FH-001 🇨🇳娄底-176ms"

  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT

rules:
  - DOMAIN-SUFFIX,cn,🎯 全球直连
  - DOMAIN-KEYWORD,-cn,🎯 全球直连
  - GEOIP,CN,🎯 全球直连,no-resolve
  - MATCH,🚀 节点选择
